name: Bug report
description: Something broken? Tell us exactly how to reproduce it.
title: "[bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Extension version
      description: chrome://extensions → Heros PDF (e.g. 2.3.2)
      placeholder: "2.3.2"
    validations: { required: true }
  - type: input
    id: env
    attributes:
      label: Browser + OS
      placeholder: "Chrome 126, Windows 11"
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "1. Opened X.pdf (size/pages) → 2. Clicked Y → 3. Saw Z"
      placeholder: "1. ... 2. ... 3. ..."
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      placeholder: "Expected A, got B"
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Console log + screenshot
      description: Ctrl+Shift+J → copy errors; drag and drop a screenshot/GIF here
      render: text
